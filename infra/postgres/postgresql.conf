# PostgreSQL — config aplicada via `-c config_file` no docker-compose.
# Tuning para a VPS de partida (~4 vCPU / 16 GB RAM) — ADR-0005 / invariante 6.
# Em máquina de dev menor, reduza shared_buffers/effective_cache_size ou suba sem este arquivo.

data_directory = '/var/lib/postgresql/data'
hba_file = '/etc/postgresql/pg_hba.conf'
listen_addresses = '*'
max_connections = 100

# --- memória (16 GB) ---
shared_buffers = 4GB
effective_cache_size = 12GB
maintenance_work_mem = 1GB
work_mem = 32MB
wal_buffers = 16MB

# --- SSD / IO ---
random_page_cost = 1.1
effective_io_concurrency = 200

# --- WAL / checkpoint ---
min_wal_size = 1GB
max_wal_size = 4GB
checkpoint_completion_target = 0.9
default_statistics_target = 100

# --- observabilidade: registra consultas lentas (alinha com o gatilho p95 > 300 ms) ---
log_min_duration_statement = 300
log_timezone = 'UTC'
timezone = 'UTC'
