# Host-based auth — restringe a ORIGEM de rede de cada role (§8.1.2, defesa em profundidade).
# net_core = 172.28.0.0/16 (api/worker/ai); net_consentimento = 172.29.0.0/16 (consentimento).
# Sem catch-all: conexões fora destas origens são REJEITADAS.
#
# TYPE  DATABASE  USER                ADDRESS         METHOD
local   all       all                                 trust
host    all       postgres            samenet         scram-sha-256
host    all       postgres            127.0.0.1/32    scram-sha-256
# role analítica: SÓ da rede core.
host    all       role_analitica      172.28.0.0/16   scram-sha-256
# role de consentimento: SÓ da rede isolada (não alcança, nem é alcançada por, net_core).
host    all       role_consentimento  172.29.0.0/16   scram-sha-256
