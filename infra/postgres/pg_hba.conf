# Host-based auth — só conexões das redes internas do Docker (defesa em profundidade, §8.1.2).
# Usamos `samenet` (e não /16 cravados): aceita apenas as sub-redes às quais o próprio Postgres
# está diretamente conectado — net_core e net_consentimento — e REJEITA o resto (sem catch-all).
# Motivo: em host COMPARTILHADO os subnets do Docker são dinâmicos (cravar 172.28/172.29 colide
# com outros stacks e quebra a auth quando o Docker sorteia outra faixa). A separação por papel
# segue garantida por: senha exclusiva por role + a role de consentimento só existe no serviço de
# consentimento (rede isolada, não alcança net_core) + GRANT/RLS (a role analítica não lê `app`).
#
# TYPE  DATABASE  USER                ADDRESS         METHOD
local   all       all                                 trust
host    all       postgres            samenet         scram-sha-256
host    all       postgres            127.0.0.1/32    scram-sha-256
# role analítica: redes internas do Docker (net_core).
host    all       role_analitica      samenet         scram-sha-256
# role de consentimento: redes internas do Docker (net_consentimento, isolada de net_core).
host    all       role_consentimento  samenet         scram-sha-256
