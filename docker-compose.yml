# DadoSabedoria — stack da versão fundacional (VPS, docker-compose).
#
# Stack MÍNIMA (default, sem profile): proxy, api, db, redis + migrator (one-shot).
#   `docker compose up`  → sobe só o essencial (economia de recurso na VPS — invariante 6).
# MinIO entra com a ingestão (profile `ingestion`); observabilidade é opt-in (profile
# `observability`). Detalhes em ADR-0005.
#
# Isolamento de PII (§8.1): api/worker/ai NÃO recebem CONSENT_DATABASE_URL/APP_FIELD_KEY
# (checado por teste estático no CI) e ficam na rede `net_core`; o serviço de consentimento
# fica sozinho com o banco em `net_consentimento` — a `ai` não compartilha rede com ele.

services:
  proxy:
    image: traefik:v3.1
    # Config estática lida de /etc/traefik/traefik.yml (montada abaixo — ADR-0005/PASSO-5).
    # Dev (ACME_EMAIL vazio): ACME inativo, certificado auto-assinado ou acesso direto às portas.
    # Prod (ACME_EMAIL + PUBLIC_DOMAIN definidos): Let's Encrypt via tlsChallenge automático.
    ports: ["80:80", "443:443"]
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./infra/traefik:/etc/traefik:ro"
      - "acme:/acme"
    # net_consentimento só para ROTEAR ao serviço de consentimento (ingress controlado);
    # api/worker/ai seguem sem acesso ao schema app.
    networks: [net_core, net_consentimento]
    depends_on:
      api: {condition: service_started}

  db:
    image: postgis/postgis:16-3.4
    command:
      - "postgres"
      - "-c"
      - "config_file=/etc/postgresql/postgresql.conf"
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=dadosabedoria
    shm_size: "256mb"
    volumes:
      - "pgdata:/var/lib/postgresql/data"
      - "./infra/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro"
      - "./infra/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "dadosabedoria"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [net_core, net_consentimento]

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [net_core]

  # One-shot: migra (admin) e semeia (role_analitica), depois encerra. É privilegiado —
  # único, além do consentimento, que recebe CONSENT_DATABASE_URL (para criar a role).
  migrator:
    build: ./api
    command: ["python", "-m", "app.migrate"]
    environment:
      - ADMIN_DATABASE_URL=${ADMIN_DATABASE_URL}
      - DATABASE_URL=${DATABASE_URL}
      - CONSENT_DATABASE_URL=${CONSENT_DATABASE_URL}
    depends_on:
      db: {condition: service_healthy}
    restart: "no"
    networks: [net_core]

  api:
    build: ./api
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - DEEP_API_KEYS=${DEEP_API_KEYS}
      - LLM_API_KEY=${LLM_API_KEY}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_KEY=${S3_KEY}
      - S3_SECRET=${S3_SECRET}
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrator: {condition: service_completed_successfully}
    labels:
      - "traefik.enable=true"
      # Expõe só a API pública (/v1) e /health. /metrics NÃO é roteado (interno) — §13.
      - "traefik.http.routers.api.rule=PathPrefix(`/v1`) || Path(`/health`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls=true"
      - "traefik.http.routers.api.tls.certresolver=le"
      - "traefik.http.services.api.loadbalancer.server.port=8000"
      - "traefik.http.routers.api.middlewares=dsab-ratelimit@file,dsab-cors@file,dsab-headers@file,dsab-bodylimit@file"
      # Tier profundo: router separado com throttle de IP conservador (dsab-ratelimit-profundo).
      # Prioridade maior que `api` (regra mais específica) → intercepta lote/quota primeiro.
      - "traefik.http.routers.api-profundo.rule=PathPrefix(`/v1/consultas-lote`) || Path(`/v1/quota`)"
      - "traefik.http.routers.api-profundo.priority=10"
      - "traefik.http.routers.api-profundo.entrypoints=websecure"
      - "traefik.http.routers.api-profundo.tls=true"
      - "traefik.http.routers.api-profundo.tls.certresolver=le"
      - "traefik.http.routers.api-profundo.service=api"
      - "traefik.http.routers.api-profundo.middlewares=dsab-ratelimit-profundo@file,dsab-cors@file,dsab-headers@file,dsab-bodylimit@file"
    networks: [net_core]

  # --- Frontend (Next.js) — mapa semafórico do IVM. Profile `app`. ---
  web:
    build: ./web
    environment:
      - API_URL=http://api:8000 # SSR busca a API pela rede interna (sem CORS)
      - NEXT_TELEMETRY_DISABLED=1
    depends_on:
      api: {condition: service_started}
    labels:
      - "traefik.enable=true"
      # api (PathPrefix /v1, /health) tem prioridade maior; web é o catch-all.
      - "traefik.http.routers.web.rule=PathPrefix(`/`)"
      - "traefik.http.routers.web.priority=1"
      - "traefik.http.routers.web.entrypoints=websecure"
      - "traefik.http.routers.web.tls=true"
      - "traefik.http.routers.web.tls.certresolver=le"
      - "traefik.http.services.web.loadbalancer.server.port=3000"
      - "traefik.http.routers.web.middlewares=dsab-headers@file"
    networks: [net_core]
    profiles: ["app"]

  # --- MinIO: só com a ingestão (nada escreve bronze/parquet na fundação) — ADR-0005 ---
  minio:
    image: minio/minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      - MINIO_ROOT_USER=${S3_KEY}
      - MINIO_ROOT_PASSWORD=${S3_SECRET}
    volumes: ["minio:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [net_core]
    profiles: ["ingestion"]

  worker:
    build: ./api
    command: ["python", "-m", "app.worker"]
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_KEY=${S3_KEY}
      - S3_SECRET=${S3_SECRET}
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [net_core]
    profiles: ["ingestion"]

  # Dagster Degrau 1: reusa a imagem da api + o extra `orquestracao` (build arg). Schedule mensal
  # dispara a esteira CAGED. UI/daemon na 3000 (INTERNA — não roteada publicamente).
  orchestrator:
    build:
      context: ./api
      args:
        INSTALL_EXTRAS: "[orquestracao]"
    command: ["dagster", "dev", "-m", "app.orquestracao.definitions", "-h", "0.0.0.0", "-p", "3000"]
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_KEY=${S3_KEY}
      - S3_SECRET=${S3_SECRET}
      - S3_BUCKET_BRONZE=${S3_BUCKET_BRONZE}
      # Persistência do histórico de runs/agendamentos do Dagster (runbook DAGSTER_HOME).
      - DAGSTER_HOME=/dagster_home
    volumes: ["dagster_home:/dagster_home"]
    depends_on:
      db: {condition: service_healthy}
    networks: [net_core]
    profiles: ["ingestion"]

  # --- IA ancorada. Recebe DATABASE_URL (role_analitica), NUNCA cred. do app. ---
  ai:
    build: ./api
    command: ["python", "-m", "app.ia.server"]
    environment:
      - DATABASE_URL=${DATABASE_URL}
      # Narrador: provedor OpenAI-compatível (DeepSeek/Ollama). Vazio ⇒ template determinístico.
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_MODEL=${LLM_MODEL}
      - LLM_API_KEY=${LLM_API_KEY}
    networks: [net_core]
    profiles: ["ai"]

  # --- Consentimento (PII). ÚNICO com cred. do app; rede ISOLADA. ---
  consentimento:
    build: ./api
    command: ["python", "-m", "app.consentimento.server"]
    environment:
      - CONSENT_DATABASE_URL=${CONSENT_DATABASE_URL}
      - APP_FIELD_KEY=${APP_FIELD_KEY}
      - APP_FIELD_KEYS_ANTIGAS=${APP_FIELD_KEYS_ANTIGAS}
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGINS=${CORS_ORIGINS}
    depends_on:
      db: {condition: service_healthy}
    labels:
      - "traefik.enable=true"
      # Rotas de PII/auth do cidadão (prioridade > api, que pega o resto de /v1).
      - "traefik.http.routers.consent.rule=PathPrefix(`/v1/alertas`) || PathPrefix(`/v1/auth`) || Path(`/v1/eu`)"
      - "traefik.http.routers.consent.priority=100"
      - "traefik.http.routers.consent.entrypoints=websecure"
      - "traefik.http.routers.consent.tls=true"
      - "traefik.http.routers.consent.tls.certresolver=le"
      - "traefik.http.services.consent.loadbalancer.server.port=8000"
      - "traefik.http.routers.consent.middlewares=dsab-cors@file,dsab-headers@file"
    networks: [net_consentimento]
    profiles: ["consent"]

  # --- Observabilidade (opt-in; pesada — não co-residir com api+ingestão na VPS, ADR-0005) ---
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes: ["./infra/otel-collector/config.yaml:/etc/otel/config.yaml:ro"]
    networks: [net_core]
    profiles: ["observability"]

  prometheus:
    image: prom/prometheus:v2.55.0
    volumes: ["./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    networks: [net_core]
    profiles: ["observability"]

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes: ["./infra/grafana/provisioning:/etc/grafana/provisioning:ro"]
    networks: [net_core]
    profiles: ["observability"]

  loki:
    image: grafana/loki:3.2.0
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes: ["./infra/loki/loki-config.yml:/etc/loki/loki-config.yml:ro"]
    networks: [net_core]
    profiles: ["observability"]

  tempo:
    image: grafana/tempo:2.6.0
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes: ["./infra/tempo/tempo.yml:/etc/tempo/tempo.yml:ro"]
    networks: [net_core]
    profiles: ["observability"]

volumes:
  pgdata: {}
  minio: {}
  dagster_home: {}   # histórico de runs/agendamentos do orchestrator (sobrevive a restart)
  acme: {}           # certificados Let's Encrypt; sobrevive a restart do Traefik

networks:
  net_core:
    ipam:
      config:
        # Configurável via CORE_SUBNET (evita conflito em host compartilhado).
        - subnet: ${CORE_SUBNET:-172.28.0.0/16}
  net_consentimento:
    ipam:
      config:
        - subnet: ${CONSENT_SUBNET:-172.29.0.0/16}
