# gitleaks — varredura de segredos no CI.
title = "DadoSabedoria gitleaks"

[extend]
useDefault = true

[allowlist]
description = "Placeholders e exemplos não são segredos reais."
paths = [
  '''\.env\.example$''',
]
regexes = [
  '''change_me[_a-z]*''',
  '''ci[-_][a-z0-9_-]{4,}''',  # valores de teste do CI (ci_admin, ci-jwt-secret-..., ci-app-field-key-...)
  '''claude\.ai/code/\S+''',   # trailer de sessão do Claude Code nos commits — referência, não segredo
]
