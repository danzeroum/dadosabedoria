components:
  schemas:
    Citacao:
      properties:
        fonte:
          title: Fonte
          type: string
        indicador:
          title: Indicador
          type: string
        lag_tipico_dias:
          anyOf:
          - type: integer
          - type: 'null'
          title: Lag Tipico Dias
        metodologia:
          title: Metodologia
          type: string
        nome:
          title: Nome
          type: string
        periodo_ate:
          anyOf:
          - type: string
          - type: 'null'
          title: Periodo Ate
        periodo_de:
          anyOf:
          - type: string
          - type: 'null'
          title: Periodo De
      required:
      - indicador
      - nome
      - fonte
      - metodologia
      title: Citacao
      type: object
    ConsultaItem:
      properties:
        ate:
          anyOf:
          - type: string
          - type: 'null'
          description: período final YYYY-MM
          title: Ate
        de:
          anyOf:
          - type: string
          - type: 'null'
          description: período inicial YYYY-MM
          title: De
        indicador:
          description: código namespaced do indicador (obrigatório)
          title: Indicador
          type: string
        por_pagina:
          default: 100
          maximum: 1000.0
          minimum: 1.0
          title: Por Pagina
          type: integer
        territorio:
          anyOf:
          - type: string
          - type: 'null'
          description: codigo_ibge do território
          title: Territorio
      required:
      - indicador
      title: ConsultaItem
      type: object
    ConsultaLoteIn:
      properties:
        consultas:
          items:
            $ref: '#/components/schemas/ConsultaItem'
          maxItems: 50
          minItems: 1
          title: Consultas
          type: array
      required:
      - consultas
      title: ConsultaLoteIn
      type: object
    FonteOut:
      properties:
        ate:
          title: Ate
          type: string
        atraso:
          title: Atraso
          type: string
        dominio:
          title: Dominio
          type: string
        nome:
          title: Nome
          type: string
        orgao:
          title: Orgao
          type: string
        sigla:
          title: Sigla
          type: string
      required:
      - sigla
      - nome
      - orgao
      - dominio
      - ate
      - atraso
      title: FonteOut
      type: object
    FonteSelo:
      description: Uma fonte no selo de confiança (primitivo compartilhado OndeFoi
        ↔ IVM).
      properties:
        ate:
          title: Ate
          type: string
        atraso:
          title: Atraso
          type: string
        dominio:
          title: Dominio
          type: string
        nome:
          title: Nome
          type: string
        orgao:
          title: Orgao
          type: string
        sigla:
          title: Sigla
          type: string
      required:
      - sigla
      - nome
      - orgao
      - dominio
      - ate
      - atraso
      title: FonteSelo
      type: object
    FuncaoOut:
      properties:
        empenhado:
          title: Empenhado
          type: integer
        exe_estado:
          enum:
          - valor
          - suprimido
          - sem_cobertura
          title: Exe Estado
          type: string
        funcao:
          title: Funcao
          type: string
        liquidado:
          anyOf:
          - type: integer
          - type: 'null'
          title: Liquidado
        pct:
          anyOf:
          - type: integer
          - type: 'null'
          title: Pct
      required:
      - funcao
      - empenhado
      - liquidado
      - exe_estado
      - pct
      title: FuncaoOut
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    IVMItem:
      properties:
        codigo_ibge:
          title: Codigo Ibge
          type: string
        ivm:
          title: Ivm
          type: number
        nome:
          title: Nome
          type: string
        periodo:
          title: Periodo
          type: string
        semaforo:
          title: Semaforo
          type: string
        uf:
          anyOf:
          - type: string
          - type: 'null'
          title: Uf
        v_emprego:
          title: V Emprego
          type: number
        v_financas:
          title: V Financas
          type: number
        v_saude:
          anyOf:
          - type: number
          - type: 'null'
          title: V Saude
        v_saude_estado:
          default: sem_cobertura
          enum:
          - valor
          - suprimido
          - sem_cobertura
          title: V Saude Estado
          type: string
      required:
      - codigo_ibge
      - nome
      - periodo
      - ivm
      - semaforo
      - v_emprego
      - v_financas
      title: IVMItem
      type: object
    IndicadorOut:
      properties:
        atualizacao:
          title: Atualizacao
          type: string
        codigo:
          title: Codigo
          type: string
        descricao:
          title: Descricao
          type: string
        dominio:
          title: Dominio
          type: string
        meta:
          $ref: '#/components/schemas/MetaProveniencia'
        metodologia:
          title: Metodologia
          type: string
        nivel_minimo_agregacao:
          title: Nivel Minimo Agregacao
          type: string
        nome:
          title: Nome
          type: string
        polaridade:
          title: Polaridade
          type: string
        subdominio:
          title: Subdominio
          type: string
        unidade:
          title: Unidade
          type: string
        versao_metodologia:
          title: Versao Metodologia
          type: string
      required:
      - codigo
      - nome
      - descricao
      - dominio
      - subdominio
      - unidade
      - polaridade
      - atualizacao
      - nivel_minimo_agregacao
      - metodologia
      - versao_metodologia
      - meta
      title: IndicadorOut
      type: object
    IndicadorValorOut:
      description: Último valor de um indicador no território, com proveniência por
        indicador (multi-fonte).
      properties:
        codigo:
          title: Codigo
          type: string
        dominio:
          title: Dominio
          type: string
        fonte:
          title: Fonte
          type: string
        lag_tipico_dias:
          anyOf:
          - type: integer
          - type: 'null'
          title: Lag Tipico Dias
        metodologia:
          title: Metodologia
          type: string
        motivo_supressao:
          anyOf:
          - type: string
          - type: 'null'
          title: Motivo Supressao
        nome:
          title: Nome
          type: string
        periodo:
          title: Periodo
          type: string
        polaridade:
          title: Polaridade
          type: string
        subdominio:
          title: Subdominio
          type: string
        suprimido:
          default: false
          title: Suprimido
          type: boolean
        unidade:
          title: Unidade
          type: string
        valor:
          anyOf:
          - type: number
          - type: 'null'
          title: Valor
      required:
      - codigo
      - nome
      - dominio
      - subdominio
      - unidade
      - polaridade
      - periodo
      - valor
      - fonte
      - metodologia
      title: IndicadorValorOut
      type: object
    MesSaldoOut:
      properties:
        periodo:
          title: Periodo
          type: string
        saldo:
          title: Saldo
          type: integer
      required:
      - periodo
      - saldo
      title: MesSaldoOut
      type: object
    MetaIVM:
      description: Proveniência do IVM — índice composto, não vem de uma fonte única.
      properties:
        atraso_dias:
          default: 60
          title: Atraso Dias
          type: integer
        componentes:
          items:
            type: string
          title: Componentes
          type: array
        fontes:
          items:
            $ref: '#/components/schemas/FonteSelo'
          title: Fontes
          type: array
        indicador:
          title: Indicador
          type: string
        licenca:
          default: ''
          title: Licenca
          type: string
        metodologia:
          title: Metodologia
          type: string
        nome:
          title: Nome
          type: string
        periodo:
          anyOf:
          - type: string
          - type: 'null'
          title: Periodo
        periodo_rotulo:
          anyOf:
          - type: string
          - type: 'null'
          title: Periodo Rotulo
        semaforo:
          additionalProperties:
            type: string
          title: Semaforo
          type: object
        versao_metodologia:
          title: Versao Metodologia
          type: string
      required:
      - indicador
      - nome
      - metodologia
      - versao_metodologia
      - componentes
      - semaforo
      title: MetaIVM
      type: object
    MetaOndeFoi:
      properties:
        atraso_dias:
          title: Atraso Dias
          type: integer
        fontes:
          items:
            $ref: '#/components/schemas/FonteOut'
          title: Fontes
          type: array
        licenca:
          title: Licenca
          type: string
        metodologia:
          title: Metodologia
          type: string
        periodo:
          title: Periodo
          type: string
        periodo_rotulo:
          title: Periodo Rotulo
          type: string
        versao_metodologia:
          title: Versao Metodologia
          type: string
      required:
      - metodologia
      - versao_metodologia
      - periodo
      - periodo_rotulo
      - atraso_dias
      - licenca
      - fontes
      title: MetaOndeFoi
      type: object
    MetaProveniencia:
      description: Proveniência exigida em toda resposta (invariante 5).
      properties:
        fonte:
          title: Fonte
          type: string
        indicador:
          title: Indicador
          type: string
        lag_tipico_dias:
          anyOf:
          - type: integer
          - type: 'null'
          title: Lag Tipico Dias
        licenca:
          title: Licenca
          type: string
        metodologia:
          title: Metodologia
          type: string
        nome:
          title: Nome
          type: string
      required:
      - indicador
      - nome
      - fonte
      - metodologia
      - licenca
      title: MetaProveniencia
      type: object
    OndeFoiOut:
      description: Liquidado ÷ empenhado por função (ADR-0029); % sobre a base divulgada,
        fora explícito.
      properties:
        banda:
          enum:
          - alta
          - parcial
          - baixa
          - indef
          title: Banda
          type: string
        codigo_ibge:
          title: Codigo Ibge
          type: string
        empenhado_base:
          title: Empenhado Base
          type: integer
        empenhado_fora_base:
          title: Empenhado Fora Base
          type: integer
        empenhado_total:
          title: Empenhado Total
          type: integer
        funcoes:
          items:
            $ref: '#/components/schemas/FuncaoOut'
          title: Funcoes
          type: array
        liquidado:
          title: Liquidado
          type: integer
        meta:
          $ref: '#/components/schemas/MetaOndeFoi'
        nome:
          title: Nome
          type: string
        pct:
          title: Pct
          type: integer
        uf:
          title: Uf
          type: string
      required:
      - codigo_ibge
      - nome
      - uf
      - empenhado_total
      - empenhado_base
      - empenhado_fora_base
      - liquidado
      - pct
      - banda
      - funcoes
      - meta
      title: OndeFoiOut
      type: object
    Paginacao:
      properties:
        pagina:
          title: Pagina
          type: integer
        por_pagina:
          title: Por Pagina
          type: integer
        total:
          title: Total
          type: integer
      required:
      - pagina
      - por_pagina
      - total
      title: Paginacao
      type: object
    PanoramaOut:
      description: 'O que sabemos do município: o último valor de cada indicador público,
        com proveniência.'
      properties:
        codigo_ibge:
          title: Codigo Ibge
          type: string
        indicadores:
          items:
            $ref: '#/components/schemas/IndicadorValorOut'
          title: Indicadores
          type: array
        nivel:
          title: Nivel
          type: string
        nome:
          title: Nome
          type: string
        uf:
          anyOf:
          - type: string
          - type: 'null'
          title: Uf
      required:
      - codigo_ibge
      - nome
      - nivel
      - indicadores
      title: PanoramaOut
      type: object
    PerguntaIA:
      properties:
        ate:
          anyOf:
          - type: string
          - type: 'null'
          description: período final YYYY-MM
          title: Ate
        de:
          anyOf:
          - type: string
          - type: 'null'
          description: período inicial YYYY-MM
          title: De
        indicador:
          anyOf:
          - type: string
          - type: 'null'
          description: código do indicador (opcional)
          title: Indicador
        pergunta:
          maxLength: 1000
          minLength: 1
          title: Pergunta
          type: string
        territorio:
          anyOf:
          - type: string
          - type: 'null'
          description: codigo_ibge (opcional)
          title: Territorio
      required:
      - pergunta
      title: PerguntaIA
      type: object
    PulsoProdutivoOut:
      description: 'Pulso do emprego formal (Novo CAGED): a batida atual + o momento
        + a janela como contexto.'
      properties:
        codigo_ibge:
          title: Codigo Ibge
          type: string
        meses:
          items:
            $ref: '#/components/schemas/MesSaldoOut'
          title: Meses
          type: array
        meses_negativos:
          title: Meses Negativos
          type: integer
        meses_positivos:
          title: Meses Positivos
          type: integer
        meta:
          $ref: '#/components/schemas/MetaProveniencia'
        nome:
          title: Nome
          type: string
        nota:
          title: Nota
          type: string
        periodo:
          title: Periodo
          type: string
        pulso:
          enum:
          - aquecido
          - estavel
          - esfriando
          title: Pulso
          type: string
        saldo_acumulado:
          title: Saldo Acumulado
          type: integer
        saldo_mes:
          title: Saldo Mes
          type: integer
        tendencia:
          anyOf:
          - enum:
            - melhorando
            - estavel
            - piorando
            type: string
          - type: 'null'
          title: Tendencia
        uf:
          anyOf:
          - type: string
          - type: 'null'
          title: Uf
      required:
      - codigo_ibge
      - nome
      - uf
      - periodo
      - saldo_mes
      - saldo_acumulado
      - pulso
      - tendencia
      - meses_positivos
      - meses_negativos
      - meses
      - nota
      - meta
      title: PulsoProdutivoOut
      type: object
    RespostaIA:
      properties:
        abstencao:
          title: Abstencao
          type: boolean
        citacoes:
          items:
            $ref: '#/components/schemas/Citacao'
          title: Citacoes
          type: array
        narrador:
          title: Narrador
          type: string
        resposta:
          title: Resposta
          type: string
        ressalvas:
          items:
            type: string
          title: Ressalvas
          type: array
        revisao_humana:
          title: Revisao Humana
          type: boolean
      required:
      - resposta
      - abstencao
      - citacoes
      - ressalvas
      - revisao_humana
      - narrador
      title: RespostaIA
      type: object
    RespostaIVM:
      properties:
        dados:
          items:
            $ref: '#/components/schemas/IVMItem'
          title: Dados
          type: array
        meta:
          $ref: '#/components/schemas/MetaIVM'
        paginacao:
          $ref: '#/components/schemas/Paginacao'
      required:
      - dados
      - meta
      - paginacao
      title: RespostaIVM
      type: object
    RespostaIVMSerie:
      properties:
        dados:
          items:
            $ref: '#/components/schemas/IVMItem'
          title: Dados
          type: array
        meta:
          $ref: '#/components/schemas/MetaIVM'
      required:
      - dados
      - meta
      title: RespostaIVMSerie
      type: object
    RespostaIndicadores:
      properties:
        dados:
          items:
            $ref: '#/components/schemas/IndicadorOut'
          title: Dados
          type: array
        paginacao:
          $ref: '#/components/schemas/Paginacao'
      required:
      - dados
      - paginacao
      title: RespostaIndicadores
      type: object
    RespostaLote:
      properties:
        resultados:
          items:
            $ref: '#/components/schemas/ResultadoLote'
          title: Resultados
          type: array
        total:
          title: Total
          type: integer
      required:
      - resultados
      - total
      title: RespostaLote
      type: object
    RespostaValores:
      properties:
        dados:
          items:
            $ref: '#/components/schemas/ValorOut'
          title: Dados
          type: array
        meta:
          $ref: '#/components/schemas/MetaProveniencia'
        paginacao:
          $ref: '#/components/schemas/Paginacao'
      required:
      - dados
      - meta
      - paginacao
      title: RespostaValores
      type: object
    ResultadoLote:
      properties:
        dados:
          anyOf:
          - items:
              $ref: '#/components/schemas/ValorOut'
            type: array
          - type: 'null'
          title: Dados
        erro:
          anyOf:
          - type: string
          - type: 'null'
          title: Erro
        indicador:
          title: Indicador
          type: string
        meta:
          anyOf:
          - $ref: '#/components/schemas/MetaProveniencia'
          - type: 'null'
        paginacao:
          anyOf:
          - $ref: '#/components/schemas/Paginacao'
          - type: 'null'
        territorio:
          anyOf:
          - type: string
          - type: 'null'
          title: Territorio
      required:
      - indicador
      title: ResultadoLote
      type: object
    TerritorioOut:
      properties:
        codigo_ibge:
          title: Codigo Ibge
          type: string
        nivel:
          title: Nivel
          type: string
        nome:
          title: Nome
          type: string
        pai:
          anyOf:
          - $ref: '#/components/schemas/TerritorioRef'
          - type: 'null'
        populacao:
          anyOf:
          - type: integer
          - type: 'null'
          title: Populacao
        uf:
          anyOf:
          - type: string
          - type: 'null'
          title: Uf
      required:
      - codigo_ibge
      - nome
      - nivel
      title: TerritorioOut
      type: object
    TerritorioRef:
      properties:
        codigo_ibge:
          title: Codigo Ibge
          type: string
        nivel:
          title: Nivel
          type: string
        nome:
          title: Nome
          type: string
      required:
      - codigo_ibge
      - nome
      - nivel
      title: TerritorioRef
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
    ValorOut:
      properties:
        confiabilidade:
          anyOf:
          - type: integer
          - type: 'null'
          title: Confiabilidade
        motivo_supressao:
          anyOf:
          - type: string
          - type: 'null'
          title: Motivo Supressao
        periodo:
          examples:
          - 2026-04
          title: Periodo
          type: string
        suprimido:
          default: false
          title: Suprimido
          type: boolean
        valor:
          anyOf:
          - type: number
          - type: 'null'
          title: Valor
      required:
      - periodo
      - valor
      title: ValorOut
      type: object
info:
  description: Leitura de indicadores de dados públicos brasileiros, com proveniência.
  title: DadoSabedoria — API pública
  version: 0.1.0
openapi: 3.1.0
paths:
  /health:
    get:
      operationId: health_health_get
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Health Health Get
                type: object
          description: Successful Response
      summary: Health
      tags:
      - infra
  /v1/consultas-lote:
    post:
      description: 'Tier PROFUNDO: várias consultas de valores num só request. Mesmo
        dado público; o que muda é

        a conveniência/escala (open-core). Requer chave de API válida (Bearer ou X-API-Key).'
      operationId: consultas_lote_v1_consultas_lote_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsultaLoteIn'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaLote'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Consultas Lote
      tags:
      - profundo
  /v1/ia/perguntar:
    post:
      description: Responde SÓ com o que recupera do repositório, com citação; sem
        dado, abstém-se.
      operationId: perguntar_v1_ia_perguntar_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PerguntaIA'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaIA'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Perguntar
      tags:
      - ia
  /v1/indicadores:
    get:
      operationId: listar_indicadores_v1_indicadores_get
      parameters:
      - in: query
        name: dominio
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Dominio
      - in: query
        name: pagina
        required: false
        schema:
          default: 1
          minimum: 1
          title: Pagina
          type: integer
      - in: query
        name: por_pagina
        required: false
        schema:
          default: 100
          maximum: 1000
          minimum: 1
          title: Por Pagina
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaIndicadores'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Listar Indicadores
      tags:
      - indicadores
  /v1/indicadores/{codigo}:
    get:
      operationId: obter_indicador_v1_indicadores__codigo__get
      parameters:
      - in: path
        name: codigo
        required: true
        schema:
          title: Codigo
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndicadorOut'
          description: Successful Response
        '422':
          content:
            application/json:
