# Prometheus (perfil observability). Raspa o /metrics interno da api e o collector.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "dadosabedoria-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]
