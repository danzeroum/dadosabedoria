info:
  description: Leitura de indicadores de dados públicos brasileiros, com proveniência.
  title: DadoSabedoria — API pública
  version: 0.1.0
openapi: 3.1.0
paths:
  /health:
    get:
      operationId: health_health_get
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Health Health Get
                type: object
          description: Successful Response
      summary: Health
      tags:
      - infra
  /v1/agua-viva/{codigo_ibge}:
    get:
      description: 'Acesso a água tratada e coleta de esgoto por município (AguaViva
        — SANE-01).


        Indicadores IN023_AE (água) e IN015_AE (esgoto) do SNIS.

        404 quando não há dado SNIS para o município.'
      operationId: agua_viva_v1_agua_viva__codigo_ibge__get
      parameters:
      - in: path
        name: codigo_ibge
        required: true
        schema:
          title: Codigo Ibge
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AguaVivaOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Agua Viva
      tags:
      - produtos
  /v1/bussola-edu-trabalho/{codigo_ibge}:
    get:
      description: 'Base educacional e mercado de trabalho formal do município (Bússola
        EDU-01).


        Combina matrículas do ensino fundamental (INEP/Censo Escolar, anual) com o
        saldo de emprego

        formal e o salário médio das admissões (CAGED, mensal). A relação é de CONTEXTO,
        não causal.

        404 quando não há nenhum dado disponível para o município.'
      operationId: bussola_edu_trabalho_v1_bussola_edu_trabalho__codigo_ibge__get
      parameters:
      - in: path
        name: codigo_ibge
        required: true
        schema:
          title: Codigo Ibge
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BussolaEduTrabOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Bussola Edu Trabalho
      tags:
      - produtos
  /v1/cobertura/caged:
    get:
      description: 'Cobertura atual do CAGED no acervo.


        Retorna quantos municípios têm dado CAGED e se o modo é demonstração (``demo=true``
        quando

        há menos de 50 municípios). O rótulo cai automaticamente após a ingestão nacional
        — não é

        hardcode. Usado pelas telas da família CAGED (Pulso, Salário Radar, Região
        Emprega, IVM).'
      operationId: cobertura_caged_v1_cobertura_caged_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoberturaCAGED'
          description: Successful Response
      summary: Cobertura Caged
      tags:
      - indicadores
      - cobertura
  /v1/cobertura/datasus:
    get:
      description: 'Cobertura atual do DATASUS/SIH no acervo.


        Retorna quantos municípios têm dado SIH e se o modo é demonstração

        (``demo=true`` quando há menos de 50 municípios). O rótulo cai automaticamente
        após a

        ingestão real via ``run_datasus`` — não é hardcode. Usado pela tela Sentinela
        Respiratória.'
