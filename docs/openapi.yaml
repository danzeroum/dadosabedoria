    CoberturaCAGED:
      description: 'Cobertura atual do CAGED no acervo — detecta modo demonstração
        automaticamente.


        ``demo=true`` quando há menos de 50 municípios (seed de teste vs. ~5.500 nacional).

        O rótulo cai sozinho após a ingestão nacional; não é hardcode.'
      properties:
        aviso:
          anyOf:
          - type: string
          - type: 'null'
          title: Aviso
        demo:
          title: Demo
          type: boolean
        n_municipios:
          title: N Municipios
          type: integer
