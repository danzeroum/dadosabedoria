# Middlewares dinâmicos do Traefik (provider file). Referenciados por @file nas labels da api.
http:
  middlewares:
    dsab-ratelimit:
      rateLimit:
        average: 100      # req/s média por origem
        burst: 50
    dsab-cors:
      headers:
        # NUNCA '*' (§8): allowlist explícita. Ajuste por ambiente.
        accessControlAllowOriginList:
          - "http://localhost:3000"
        accessControlAllowMethods: ["GET", "POST", "DELETE", "OPTIONS"]
        accessControlAllowHeaders: ["Authorization", "Content-Type"]
        accessControlMaxAge: 600
        addVaryHeader: true
    dsab-headers:
      headers:
        frameDeny: true
        contentTypeNosniff: true
        browserXssFilter: true
        referrerPolicy: "no-referrer"
        # HSTS só quando o TLS estiver ligado (não enviar sobre HTTP). Habilitar em produção:
        # stsSeconds: 31536000
        # stsIncludeSubdomains: true
