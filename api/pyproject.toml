[project]
name = "dadosabedoria-api"
version = "0.1.0"
description = "DadoSabedoria — backend (monólito modular): leitura de indicadores, ingestão e isolamento de PII."
requires-python = ">=3.12"
dependencies = [
    # <0.137: a 0.137 introduziu `_IncludedRouter` em `app.routes`, que quebra o
    # prometheus-fastapi-instrumentator (`_get_route_name` faz `route.path` sem guardar rotas
    # sem `.path`) — 133 testes de integração falham por request. Bug ainda presente no
    # instrumentator 8.0.0; revisitar o teto quando o upstream tratar `_IncludedRouter`.
    "fastapi>=0.115,<0.137",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.29,<1.0",
    "alembic>=1.13,<2.0",
    "redis>=5.0,<6.0",
    "structlog>=24.1,<26.0",
    "prometheus-fastapi-instrumentator>=7.0,<8.0",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.46b0",
    "opentelemetry-instrumentation-redis>=0.46b0",
    "opentelemetry-exporter-otlp>=1.25",
    "PyYAML>=6.0,<7.0",
    # --- ingestão (medallion) ---
    "polars>=1.0,<2.0",
    "minio>=7.2,<8.0",
    "py7zr>=1.1.3,<2.0",  # 1.1.3 corrige CVE-2026-23879/55206/55195 (API SevenZipFile/readall estável)
    # Decoder DBC do DATASUS/SIH: Rust wheel nativo (sem pyarrow/setuptools), Python 3.12 ok.
    "datasus-dbc>=0.1,<1.0",
    "dbfread>=2.0,<3.0",
    # --- consentimento (PII isolada): cifragem de campo + JWT do cidadão ---
    "cryptography>=48.0.1,<49",  # 48.0.1 corrige GHSA-537c-gmf6-5ccf (+ PYSEC-2026-35/36, CVE-2026-26007)
    "PyJWT>=2.8,<3.0",
    # --- IA: cliente HTTP do narrador ancorado (provedor OpenAI-compatível: DeepSeek/Ollama) ---
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
# Runtime de orquestração (só o contêiner `orchestrator` precisa do Dagster).
orquestracao = [
    "dagster>=1.8,<2.0",
    "dagster-webserver>=1.8,<2.0",
]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-cov>=5.0,<7.0",
    "pytest-bdd>=7.1,<9.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.10,<2.0",
    "bandit>=1.7,<2.0",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------
# Linters / static analysis (SAST) — invariant 7
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, comprehensions, pyupgrade, security (S = bandit-like)
select = ["E", "F", "I", "B", "C4", "UP", "S", "W"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.lint.flake8-bugbear]
# Idioma FastAPI: chamadas em defaults de parâmetro são intencionais.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
# Tests may use asserts and hard-coded test secrets.
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603", "S607"]  # asserts/segredos de teste; subprocess com args literais
"alembic/**" = ["S608"]  # bootstrap DDL is built from trusted env, justified inline

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true
files = ["app"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]

# ---------------------------------------------------------------------------
# Tests / coverage — invariant 7 (mais cobertura onde há mais risco)
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires a live Postgres+PostGIS (and Redis)",
    "system: end-to-end across the running stack",
    "orquestracao: requires the Dagster runtime (extra orquestracao)",
]
addopts = "-ra"

[tool.coverage.run]
source = ["app"]
omit = [
    "app/ia/server.py",          # entrypoint do serviço isolado de IA
    "app/consentimento/server.py",  # entrypoint do serviço isolado de consentimento
    "app/orquestracao/*",        # validado no job de CI dedicado (requer Dagster)
    "app/ingestao/run_caged.py",  # entrypoint CLI (rede/S3)
    "app/ingestao/run_estban.py", # entrypoint CLI (rede/S3)
    "app/ingestao/run_ibge.py",   # entrypoint CLI (rede)
    "app/ingestao/run_siconfi.py",  # entrypoint CLI (rede)
    "app/consentimento/run_alertas.py",  # entrypoint CLI (roda no contêiner de consentimento)
    "app/consentimento/run_rechave.py",  # entrypoint CLI (rotação da chave de campo)
    "app/profundo/run_chaves.py",  # entrypoint CLI (emissão/revogação de chaves, admin)
    "app/**/__main__.py",
    "alembic/*",
]
# SQLAlchemy async usa greenlet; sem isto o coverage perde linhas após um await no DB.
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
