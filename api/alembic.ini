# Alembic — migrações da camada de dados.
# A URL NÃO fica aqui: env.py lê ADMIN_DATABASE_URL do ambiente (12-factor / segredo fora do código).
# Autogenerate é desligado por política (ADR-0003): todo DDL é escrito à mão a partir do
# esquema canônico (a fonte da verdade do modelo de dados).
[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
