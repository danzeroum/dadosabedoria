components:
  schemas:
    Citacao:
      properties:
        fonte:
          title: Fonte
          type: string
        indicador:
          title: Indicador
          type: string
        lag_tipico_dias:
          anyOf:
          - type: integer
          - type: 'null'
          title: Lag Tipico Dias
        metodologia:
          title: Metodologia
          type: string
        nome:
          title: Nome
          type: string
        periodo_ate:
          anyOf:
          - type: string
          - type: 'null'
          title: Periodo Ate
        periodo_de:
          anyOf:
          - type: string
          - type: 'null'
          title: Periodo De
      required:
      - indicador
      - nome
      - fonte
      - metodologia
      title: Citacao
      type: object
    ConsultaItem:
      properties:
        ate:
          anyOf:
          - type: string
          - type: 'null'
          description: período final YYYY-MM
          title: Ate
        de:
          anyOf:
          - type: string
          - type: 'null'
          description: período inicial YYYY-MM
          title: De
        indicador:
          description: código namespaced do indicador (obrigatório)
          title: Indicador
          type: string
        por_pagina:
          default: 100
          maximum: 1000.0
          minimum: 1.0
          title: Por Pagina
          type: integer
        territorio:
          anyOf:
          - type: string
          - type: 'null'
          description: codigo_ibge do território
          title: Territorio
      required:
      - indicador
      title: ConsultaItem
      type: object
    ConsultaLoteIn:
      properties:
        consultas:
          items:
            $ref: '#/components/schemas/ConsultaItem'
          maxItems: 50
          minItems: 1
          title: Consultas
          type: array
      required:
      - consultas
      title: ConsultaLoteIn
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    IVMItem:
      properties:
        codigo_ibge:
          title: Codigo Ibge
          type: string
        ivm:
          title: Ivm
          type: number
        nome:
          title: Nome
          type: string
        periodo:
          title: Periodo
          type: string
        semaforo:
          title: Semaforo
          type: string
        v_emprego:
          title: V Emprego
          type: number
        v_financas:
          title: V Financas
          type: number
        v_saude:
          anyOf:
          - type: number
          - type: 'null'
          title: V Saude
        v_saude_estado:
          default: sem_cobertura
          enum:
          - valor
          - suprimido
          - sem_cobertura
          title: V Saude Estado
          type: string
      required:
      - codigo_ibge
      - nome
      - periodo
      - ivm
      - semaforo
      - v_emprego
      - v_financas
      title: IVMItem
      type: object
    IndicadorOut:
      properties:
        atualizacao:
          title: Atualizacao
          type: string
        codigo:
          title: Codigo
          type: string
        descricao:
          title: Descricao
          type: string
        dominio:
          title: Dominio
          type: string
        meta:
          $ref: '#/components/schemas/MetaProveniencia'
        metodologia:
          title: Metodologia
          type: string
        nivel_minimo_agregacao:
          title: Nivel Minimo Agregacao
          type: string
        nome:
          title: Nome
          type: string
        polaridade:
          title: Polaridade
          type: string
        subdominio:
          title: Subdominio
          type: string
        unidade:
          title: Unidade
          type: string
        versao_metodologia:
          title: Versao Metodologia
          type: string
      required:
      - codigo
      - nome
      - descricao
      - dominio
      - subdominio
      - unidade
      - polaridade
      - atualizacao
      - nivel_minimo_agregacao
      - metodologia
      - versao_metodologia
      - meta
      title: IndicadorOut
      type: object
    MetaIVM:
      description: Proveniência do IVM — índice composto, não vem de uma fonte única.
      properties:
        componentes:
          items:
            type: string
          title: Componentes
          type: array
        indicador:
          title: Indicador
          type: string
        metodologia:
          title: Metodologia
          type: string
        nome:
          title: Nome
          type: string
        periodo:
          anyOf:
          - type: string
          - type: 'null'
          title: Periodo
        semaforo:
          additionalProperties:
            type: string
          title: Semaforo
          type: object
        versao_metodologia:
          title: Versao Metodologia
          type: string
      required:
      - indicador
      - nome
      - metodologia
      - versao_metodologia
      - componentes
      - semaforo
      title: MetaIVM
      type: object
    MetaProveniencia:
      description: Proveniência exigida em toda resposta (invariante 5).
      properties:
        fonte:
          title: Fonte
          type: string
        indicador:
          title: Indicador
          type: string
        lag_tipico_dias:
          anyOf:
          - type: integer
          - type: 'null'
          title: Lag Tipico Dias
        licenca:
          title: Licenca
          type: string
        metodologia:
          title: Metodologia
          type: string
        nome:
          title: Nome
          type: string
      required:
      - indicador
      - nome
      - fonte
      - metodologia
      - licenca
      title: MetaProveniencia
      type: object
    Paginacao:
      properties:
        pagina:
          title: Pagina
          type: integer
        por_pagina:
          title: Por Pagina
          type: integer
        total:
          title: Total
          type: integer
      required:
      - pagina
      - por_pagina
      - total
      title: Paginacao
      type: object
    PerguntaIA:
      properties:
        ate:
          anyOf:
          - type: string
          - type: 'null'
          description: período final YYYY-MM
          title: Ate
        de:
          anyOf:
          - type: string
          - type: 'null'
          description: período inicial YYYY-MM
          title: De
        indicador:
          anyOf:
          - type: string
          - type: 'null'
          description: código do indicador (opcional)
          title: Indicador
        pergunta:
          maxLength: 1000
          minLength: 1
          title: Pergunta
          type: string
        territorio:
          anyOf:
          - type: string
          - type: 'null'
          description: codigo_ibge (opcional)
          title: Territorio
      required:
      - pergunta
      title: PerguntaIA
      type: object
    RespostaIA:
      properties:
        abstencao:
          title: Abstencao
          type: boolean
        citacoes:
          items:
            $ref: '#/components/schemas/Citacao'
          title: Citacoes
          type: array
        narrador:
          title: Narrador
          type: string
        resposta:
          title: Resposta
          type: string
        ressalvas:
          items:
            type: string
          title: Ressalvas
          type: array
        revisao_humana:
          title: Revisao Humana
          type: boolean
      required:
      - resposta
      - abstencao
      - citacoes
      - ressalvas
      - revisao_humana
      - narrador
      title: RespostaIA
      type: object
    RespostaIVM:
      properties:
        dados:
          items:
            $ref: '#/components/schemas/IVMItem'
          title: Dados
          type: array
        meta:
          $ref: '#/components/schemas/MetaIVM'
        paginacao:
          $ref: '#/components/schemas/Paginacao'
      required:
      - dados
      - meta
      - paginacao
      title: RespostaIVM
      type: object
    RespostaIVMSerie:
      properties:
        dados:
          items:
            $ref: '#/components/schemas/IVMItem'
          title: Dados
          type: array
        meta:
          $ref: '#/components/schemas/MetaIVM'
      required:
      - dados
      - meta
      title: RespostaIVMSerie
      type: object
    RespostaIndicadores:
      properties:
        dados:
          items:
            $ref: '#/components/schemas/IndicadorOut'
          title: Dados
          type: array
        paginacao:
          $ref: '#/components/schemas/Paginacao'
      required:
      - dados
      - paginacao
      title: RespostaIndicadores
      type: object
    RespostaLote:
      properties:
        resultados:
          items:
            $ref: '#/components/schemas/ResultadoLote'
          title: Resultados
          type: array
        total:
          title: Total
          type: integer
      required:
      - resultados
      - total
      title: RespostaLote
      type: object
    RespostaValores:
      properties:
        dados:
          items:
            $ref: '#/components/schemas/ValorOut'
          title: Dados
          type: array
        meta:
          $ref: '#/components/schemas/MetaProveniencia'
        paginacao:
          $ref: '#/components/schemas/Paginacao'
      required:
      - dados
      - meta
      - paginacao
      title: RespostaValores
      type: object
    ResultadoLote:
      properties:
        dados:
          anyOf:
          - items:
              $ref: '#/components/schemas/ValorOut'
            type: array
          - type: 'null'
          title: Dados
        erro:
          anyOf:
          - type: string
          - type: 'null'
          title: Erro
        indicador:
          title: Indicador
          type: string
        meta:
          anyOf:
          - $ref: '#/components/schemas/MetaProveniencia'
          - type: 'null'
        paginacao:
          anyOf:
          - $ref: '#/components/schemas/Paginacao'
          - type: 'null'
        territorio:
          anyOf:
          - type: string
          - type: 'null'
          title: Territorio
      required:
      - indicador
      title: ResultadoLote
      type: object
    TerritorioOut:
      properties:
        codigo_ibge:
          title: Codigo Ibge
          type: string
        nivel:
          title: Nivel
          type: string
        nome:
          title: Nome
          type: string
        pai:
          anyOf:
          - $ref: '#/components/schemas/TerritorioRef'
          - type: 'null'
        populacao:
          anyOf:
          - type: integer
          - type: 'null'
          title: Populacao
        uf:
          anyOf:
          - type: string
          - type: 'null'
          title: Uf
      required:
      - codigo_ibge
      - nome
      - nivel
      title: TerritorioOut
      type: object
    TerritorioRef:
      properties:
        codigo_ibge:
          title: Codigo Ibge
          type: string
        nivel:
          title: Nivel
          type: string
        nome:
          title: Nome
          type: string
      required:
      - codigo_ibge
      - nome
      - nivel
      title: TerritorioRef
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
    ValorOut:
      properties:
        confiabilidade:
          anyOf:
          - type: integer
          - type: 'null'
          title: Confiabilidade
        motivo_supressao:
          anyOf:
          - type: string
          - type: 'null'
          title: Motivo Supressao
        periodo:
          examples:
          - 2026-04
          title: Periodo
          type: string
        suprimido:
          default: false
          title: Suprimido
          type: boolean
        valor:
          anyOf:
          - type: number
          - type: 'null'
          title: Valor
      required:
      - periodo
      - valor
      title: ValorOut
      type: object
info:
  description: Leitura de indicadores de dados públicos brasileiros, com proveniência.
  title: DadoSabedoria — API pública
  version: 0.1.0
openapi: 3.1.0
paths:
  /health:
    get:
      operationId: health_health_get
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Health Health Get
                type: object
          description: Successful Response
      summary: Health
      tags:
      - infra
  /v1/consultas-lote:
    post:
      description: 'Tier PROFUNDO: várias consultas de valores num só request. Mesmo
        dado público; o que muda é

        a conveniência/escala (open-core). Requer chave de API válida (Bearer ou X-API-Key).'
      operationId: consultas_lote_v1_consultas_lote_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsultaLoteIn'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaLote'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Consultas Lote
      tags:
      - profundo
  /v1/ia/perguntar:
    post:
      description: Responde SÓ com o que recupera do repositório, com citação; sem
        dado, abstém-se.
      operationId: perguntar_v1_ia_perguntar_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PerguntaIA'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaIA'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Perguntar
      tags:
      - ia
  /v1/indicadores:
    get:
      operationId: listar_indicadores_v1_indicadores_get
      parameters:
      - in: query
        name: dominio
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Dominio
      - in: query
        name: pagina
        required: false
        schema:
          default: 1
          minimum: 1
          title: Pagina
          type: integer
      - in: query
        name: por_pagina
        required: false
        schema:
          default: 100
          maximum: 1000
          minimum: 1
          title: Por Pagina
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaIndicadores'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Listar Indicadores
      tags:
      - indicadores
  /v1/indicadores/{codigo}:
    get:
      operationId: obter_indicador_v1_indicadores__codigo__get
      parameters:
      - in: path
        name: codigo
        required: true
        schema:
          title: Codigo
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndicadorOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Obter Indicador
      tags:
      - indicadores
  /v1/ivm:
    get:
      description: IVM de todos os municípios num período — base do mapa semafórico.
      operationId: ivm_por_periodo_v1_ivm_get
      parameters:
      - description: 'período YYYY-MM (padrão: mais recente)'
        in: query
        name: periodo
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'período YYYY-MM (padrão: mais recente)'
          title: Periodo
      - in: query
        name: pagina
        required: false
        schema:
          default: 1
          minimum: 1
          title: Pagina
          type: integer
      - in: query
        name: por_pagina
        required: false
        schema:
          default: 1000
          maximum: 1000
          minimum: 1
          title: Por Pagina
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaIVM'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Ivm Por Periodo
      tags:
      - indicadores
      - ivm
  /v1/ivm/{codigo_ibge}:
    get:
      description: Série do IVM de um município — drill-down.
      operationId: ivm_municipio_v1_ivm__codigo_ibge__get
      parameters:
      - in: path
        name: codigo_ibge
        required: true
        schema:
          title: Codigo Ibge
          type: string
      - description: período inicial YYYY-MM
        in: query
        name: de
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: período inicial YYYY-MM
          title: De
      - description: período final YYYY-MM
        in: query
        name: ate
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: período final YYYY-MM
          title: Ate
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaIVMSerie'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Ivm Municipio
      tags:
      - indicadores
      - ivm
  /v1/mapa/ivm:
    get:
      description: GeoJSON do IVM por município de uma UF — base da coropleta geográfica.
      operationId: ivm_malha_v1_mapa_ivm_get
      parameters:
      - description: 'sigla da UF (ex.: SP)'
        in: query
        name: uf
        required: true
        schema:
          description: 'sigla da UF (ex.: SP)'
          title: Uf
          type: string
      - description: 'período YYYY-MM (padrão: mais recente)'
        in: query
        name: periodo
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'período YYYY-MM (padrão: mais recente)'
          title: Periodo
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Ivm Malha V1 Mapa Ivm Get
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Ivm Malha
      tags:
      - indicadores
      - ivm
  /v1/territorios/{codigo_ibge}:
    get:
      operationId: obter_territorio_v1_territorios__codigo_ibge__get
      parameters:
      - in: path
        name: codigo_ibge
        required: true
        schema:
          title: Codigo Ibge
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TerritorioOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Obter Territorio
      tags:
      - indicadores
  /v1/valores:
    get:
      operationId: listar_valores_v1_valores_get
      parameters:
      - description: código namespaced do indicador (obrigatório)
        in: query
        name: indicador
        required: true
        schema:
          description: código namespaced do indicador (obrigatório)
          title: Indicador
          type: string
      - description: codigo_ibge do território
        in: query
        name: territorio
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: codigo_ibge do território
          title: Territorio
      - description: período inicial YYYY-MM
        in: query
        name: de
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: período inicial YYYY-MM
          title: De
      - description: período final YYYY-MM
        in: query
        name: ate
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: período final YYYY-MM
          title: Ate
      - in: query
        name: pagina
        required: false
        schema:
          default: 1
          minimum: 1
          title: Pagina
          type: integer
      - in: query
        name: por_pagina
        required: false
        schema:
          default: 100
          maximum: 1000
          minimum: 1
          title: Por Pagina
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaValores'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Listar Valores
      tags:
      - indicadores
